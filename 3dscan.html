</html>
<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <title>Bildanalyse – Dat.GUI mit File Upload und Center Reset</title>
  <!-- dat.GUI einbinden -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/dat-gui/0.7.9/dat.gui.min.js"></script>
  <style>
    body { font-family: sans-serif; }
    table, th, td { border: 1px solid black; border-collapse: collapse; padding: 4px; }
    /* Den File-Input verstecken, da er über dat.GUI gesteuert wird */
    #fileInput { display: none; }
  </style>
</head>
<body>
  <!-- Versteckter Datei-Upload -->
  <input type="file" id="fileInput" accept="image/*">
  <script>
    (function(){
      let img = null;         // Originalbild
      let binImg = null;      // Offscreen-Canvas für das binäre Bild
      let selectedRow = -1;   // Ausgewählte Zeile (Histogramm)
      let canvas, ctx;        // Haupt-Canvas und Context

      // Webcam-bezogene Variablen
      let video = null;
      let currentStream = null;
      let webcamSourceController = null;

      // Layout-Konstanten
      const topMargin = 130;  // Platz oben für Steuerelemente/Text
      const histHeight = 100; // Höhe des Histogramms

      // Parameter-Objekt für dat.GUI
      const parameters = {
        threshold: 128,
        red: false,
        green: false,
        blue: false,
        // x-Achsen-Bereich, wird automatisch angepasst
        minX: 0,
        maxX: 100,
        analyzeRegion: function() { analyzeRegion(); },
        // File Upload: Löst den versteckten File-Input aus
        chooseFile: function() {
          document.getElementById('fileInput').click();
        },
        // Center Lines
        showCenterLines: false,
        centerX: 200,
        centerY: 200,
        resetCenter: function() {
          parameters.centerX = canvas.width / 2;
          parameters.centerY = canvas.height / 2;
          updateCenterLineDisplay();
        },
        // Webcam Parameter
        webcamEnabled: false,
        webcamSource: '',
        webcamResolution: '640x480'
      };

      // Controller-Referenzen
      let minXController, maxXController, centerXController, centerYController;

      // Aktualisiert die Anzeige der Center Line-Controller
      function updateCenterLineDisplay() {
        if (centerXController) centerXController.updateDisplay();
        if (centerYController) centerYController.updateDisplay();
      }

      // Initialisierung
      function init() {
        canvas = document.createElement('canvas');
        canvas.width = 400;
        canvas.height = 400;
        canvas.style.border = '1px solid black';
        document.body.appendChild(canvas);
        ctx = canvas.getContext('2d');

        const gui = new dat.GUI();
        // File Upload Button
        const imp = gui.addFolder('Import');
        imp.add(parameters, 'chooseFile').name("Import Picture");

        const mani = gui.addFolder('Image Manipulation');
        mani.add(parameters, 'threshold', 0, 255).onChange(function(val) {
          parameters.threshold = val;
          updateImage();
        });
        mani.add(parameters, 'red').name("Red").onChange(updateImage);
        mani.add(parameters, 'green').name("Green").onChange(updateImage);
        mani.add(parameters, 'blue').name("Blue").onChange(updateImage);

        const roi = gui.addFolder('Region of Interest');
        // minX / maxX Controller – diese werden automatisch angepasst
        minXController = roi.add(parameters, 'minX', 0, 100).step(1);
        maxXController = roi.add(parameters, 'maxX', 0, 100).step(1);

        // Gruppe für Center Lines
        const centerFolder = gui.addFolder('Center Lines');
        centerFolder.add(parameters, 'showCenterLines').name("Show Center Lines");
        centerXController = centerFolder.add(parameters, 'centerX', 0, canvas.width).step(1).name("Center X");
        centerYController = centerFolder.add(parameters, 'centerY', 0, canvas.height).step(1).name("Center Y");
        centerFolder.add(parameters, 'resetCenter').name("Reset Center");
        centerFolder.open();

        const scan = gui.addFolder('Scan');        
        scan.add(parameters, 'analyzeRegion').name("Analyse Region");

        // Webcam-Steuerelemente
        const webcamFolder = gui.addFolder('Webcam');
        webcamFolder.add(parameters, 'webcamEnabled').name("Initialise").onChange(toggleWebcam);
        webcamSourceController = webcamFolder.add(parameters, 'webcamSource', [] ).name("Webcam Source").onChange(changeWebcamSource);
        webcamFolder.add(parameters, 'webcamResolution', ['320x240', '640x480', '1280x720', '1920x1080']).name("Resolution").onChange(changeWebcamResolution);
        webcamFolder.open();

        // Kameraliste aktualisieren
        updateCameraList();

        canvas.addEventListener('mousemove', onMouseMove);
        requestAnimationFrame(draw);
      }

      // Datei-Upload-Handler
      function handleFile(event) {
        const file = event.target.files[0];
        if (!file) return;
        if (file.type.match('image.*')) {
          const reader = new FileReader();
          reader.onload = function(e) {
            img = new Image();
            img.onload = function() {
              updateCanvasSize();
              updateImage();
            };
            img.src = e.target.result;
          };
          reader.readAsDataURL(file);
        } else {
          console.log("Kein Bild gefunden!");
        }
      }

      // Passt die Canvas-Größe anhand des geladenen Bildes an
      // und aktualisiert die Bereiche minX und maxX automatisch
      function updateCanvasSize() {
        if (!img) return;
        const maxWidth = 800;
        const maxHeight = 600;
        const ratio = Math.min(maxWidth / img.width, (maxHeight - topMargin - histHeight) / img.height, 1);
        const newWidth = Math.floor(img.width * ratio);
        const newHeight = Math.floor(img.height * ratio) + topMargin + histHeight;
        canvas.width = newWidth;
        canvas.height = newHeight;
        
        // Automatische Anpassung von minX und maxX an die Bildbreite
        parameters.minX = 0;
        parameters.maxX = newWidth - 1;
        if (minXController) {
          minXController.__min = 0;
          minXController.__max = newWidth - 1;
          minXController.updateDisplay();
        }
        if (maxXController) {
          maxXController.__min = 0;
          maxXController.__max = newWidth - 1;
          maxXController.updateDisplay();
        }
        
        // Aktualisiere die Center Line-Parameter: Standard in der Mitte des Canvas
        parameters.centerX = newWidth / 2;
        parameters.centerY = newHeight / 2;
        if (centerXController) {
          centerXController.__min = 0;
          centerXController.__max = newWidth;
          centerXController.updateDisplay();
        }
        if (centerYController) {
          centerYController.__min = 0;
          centerYController.__max = newHeight;
          centerYController.updateDisplay();
        }
      }

      // Verarbeitet das Bild: Skaliert, wendet Farbfilter und Threshold an
      function updateImage() {
        if (!img) return;
        const imgDisplayWidth = canvas.width;
        const imgDisplayHeight = canvas.height - topMargin - histHeight;
        binImg = document.createElement('canvas');
        binImg.width = imgDisplayWidth;
        binImg.height = imgDisplayHeight;
        const binCtx = binImg.getContext('2d');
        binCtx.drawImage(img, 0, 0, imgDisplayWidth, imgDisplayHeight);
        let imageData = binCtx.getImageData(0, 0, imgDisplayWidth, imgDisplayHeight);
        let data = imageData.data;
        for (let i = 0; i < data.length; i += 4) {
          let r = data[i];
          let g = data[i+1];
          let b = data[i+2];
          let gray = 0;
          if (parameters.red) {
            gray = r;
          } else if (parameters.green) {
            gray = g;
          } else if (parameters.blue) {
            gray = b;
          } else {
            gray = 0.299 * r + 0.587 * g + 0.114 * b;
          }
          let binary = (gray > parameters.threshold) ? 255 : 0;
          data[i] = binary;
          data[i+1] = binary;
          data[i+2] = binary;
        }
        binCtx.putImageData(imageData, 0, 0);
      }

      // Zeichen-Schleife
      function draw() {
        ctx.fillStyle = 'rgb(240,240,240)';
        ctx.fillRect(0, 0, canvas.width, canvas.height);
        
        let offscreenCanvas = document.createElement('canvas');
        offscreenCanvas.width = canvas.width;
        offscreenCanvas.height = canvas.height;
        let offCtx = offscreenCanvas.getContext('2d');
        
        if (parameters.webcamEnabled && video && video.readyState === video.HAVE_ENOUGH_DATA) {
          // Webcam-Frame auf das Offscreen-Canvas zeichnen
          offCtx.drawImage(video, 0, 0, offscreenCanvas.width, offscreenCanvas.height);
        } else if (binImg) {
          // Hochgeladenes Bild verarbeiten
          offCtx.drawImage(binImg, 0, topMargin);
        }
        
        // Bildverarbeitung anwenden (Threshold, Farbfilter)
        let imageData = offCtx.getImageData(0, 0, offscreenCanvas.width, offscreenCanvas.height);
        let data = imageData.data;
        
        for (let i = 0; i < data.length; i += 4) {
          let r = data[i];
          let g = data[i + 1];
          let b = data[i + 2];
          let gray = 0;
          
          if (parameters.red) {
            gray = r;
          } else if (parameters.green) {
            gray = g;
          } else if (parameters.blue) {
            gray = b;
          } else {
            gray = 0.299 * r + 0.587 * g + 0.114 * b;
          }
          
          let binary = (gray > parameters.threshold) ? 255 : 0;
          data[i] = binary;
          data[i + 1] = binary;
          data[i + 2] = binary;
        }
        
        offCtx.putImageData(imageData, 0, 0);
        
        // **Zeichne das verarbeitete Bild auf das Haupt-Canvas**
        ctx.drawImage(offscreenCanvas, 0, 0, canvas.width, canvas.height);
        
        // **Region of Interest (ROI) anzeigen**
        ctx.strokeStyle = 'yellow';
        ctx.lineWidth = 1;
        let xMin = Number(parameters.minX);
        ctx.beginPath();
        ctx.moveTo(xMin, 0);
        ctx.lineTo(xMin, canvas.height);
        ctx.stroke();
        let xMax = Number(parameters.maxX);
        ctx.beginPath();
        ctx.moveTo(xMax, 0);
        ctx.lineTo(xMax, canvas.height);
        ctx.stroke();
        
        // **Center Lines anzeigen**
        if (parameters.showCenterLines) {
          ctx.strokeStyle = 'pink';
          ctx.lineWidth = 1;
          
          // Vertikale Center-Linie
          ctx.beginPath();
          ctx.moveTo(parameters.centerX, 0);
          ctx.lineTo(parameters.centerX, canvas.height);
          ctx.stroke();
          
          // Horizontale Center-Linie
          ctx.beginPath();
          ctx.moveTo(0, parameters.centerY);
          ctx.lineTo(canvas.width, parameters.centerY);
          ctx.stroke();
        }
        
        requestAnimationFrame(draw);
      }
      
      
      // Ermittelt anhand der Mausposition die entsprechende Bildzeile
      function onMouseMove(e) {
        if (binImg) {
          const rect = canvas.getBoundingClientRect();
          const mouseY = e.clientY - rect.top;
          if (mouseY >= topMargin && mouseY < topMargin + binImg.height) {
            selectedRow = mouseY - topMargin;
          }
        }
      }

      // Zeichnet das Histogramm der ausgewählten Zeile (0 = unten, 1 = oben)
      function drawRowHistogram(row) {
        if (!binImg) return;
        const histX = 0;
        const histY = binImg.height + topMargin;
        const histW = binImg.width;
        ctx.fillStyle = 'rgb(240,240,240)';
        ctx.fillRect(histX, histY, histW, histHeight);
        ctx.strokeStyle = 'black';
        ctx.beginPath();
        const binCtx = binImg.getContext('2d');
        let rowImageData = binCtx.getImageData(0, row, binImg.width, 1);
        let rowData = rowImageData.data;
        for (let x = 0; x < binImg.width; x++) {
          let index = x * 4;
          let val = rowData[index] === 255 ? 1 : 0;
          let yVal = (val === 1) ? histY : histY + histHeight;
          if (x === 0) {
            ctx.moveTo(histX + x, yVal);
          } else {
            ctx.lineTo(histX + x, yVal);
          }
        }
        ctx.stroke();
      }

      // Analysiert für jede Zeile den in dat.GUI definierten x‑Bereich (minX bis maxX)
      function analyzeRegion() {
        if (!binImg) return;
        const minX = Math.min(parameters.minX, parameters.maxX);
        const maxX = Math.max(parameters.minX, parameters.maxX);
        // Vorherige Tabelle entfernen
        let oldTable = document.getElementById('resultTable');
        if (oldTable) {
          oldTable.parentNode.removeChild(oldTable);
        }
        let table = document.createElement('table');
        table.id = 'resultTable';
        let header = document.createElement('tr');
        let th1 = document.createElement('th'); th1.textContent = 'Zeile';
        let th2 = document.createElement('th'); th2.textContent = 'Start Spalte';
        let th3 = document.createElement('th'); th3.textContent = 'End Spalte';
        header.appendChild(th1);
        header.appendChild(th2);
        header.appendChild(th3);
        table.appendChild(header);

        const binCtx = binImg.getContext('2d');
        let imageData = binCtx.getImageData(0, 0, binImg.width, binImg.height);
        let data = imageData.data;
        for (let row = 0; row < binImg.height; row++) {
          let inRun = false;
          let startCol = 0;
          for (let x = minX; x <= maxX; x++) {
            let index = (x + row * binImg.width) * 4;
            let val = data[index] === 255 ? 1 : 0;
            if (!inRun && val === 1) {
              inRun = true;
              startCol = x;
            } else if (inRun && val === 0) {
              inRun = false;
              let tableRow = document.createElement('tr');
              let td1 = document.createElement('td'); td1.textContent = row;
              let td2 = document.createElement('td'); td2.textContent = startCol;
              let td3 = document.createElement('td'); td3.textContent = x - 1;
              tableRow.appendChild(td1);
              tableRow.appendChild(td2);
              tableRow.appendChild(td3);
              table.appendChild(tableRow);
            }
          }
          if (inRun) {
            let tableRow = document.createElement('tr');
            let td1 = document.createElement('td'); td1.textContent = row;
            let td2 = document.createElement('td'); td2.textContent = startCol;
            let td3 = document.createElement('td'); td3.textContent = maxX;
            tableRow.appendChild(td1);
            tableRow.appendChild(td2);
            tableRow.appendChild(td3);
            table.appendChild(tableRow);
          }
        }
        document.body.appendChild(table);
        table.style.marginTop = (canvas.height + 10) + 'px';
      }

      // ---------------- Webcam-Funktionen ----------------

      function toggleWebcam(enabled) {
        if (enabled) {
          startWebcam();
        } else {
          stopWebcam();
          // Optional: Canvas-Größe wieder an das geladene Bild anpassen
          updateCanvasSize();
        }
      }

      function startWebcam() {
        const [width, height] = parameters.webcamResolution.split('x').map(Number);
        let constraints = {
          video: {
            width: { exact: width },
            height: { exact: height }
          }
        };
        if (parameters.webcamSource) {
          constraints.video.deviceId = { exact: parameters.webcamSource };
        }
        navigator.mediaDevices.getUserMedia(constraints)
          .then(function(stream) {
            currentStream = stream;
            if (!video) {
              video = document.createElement('video');
              video.autoplay = true;
              video.playsInline = true;
            }
            video.srcObject = stream;
            video.play();
            // Setze die Canvas-Größe passend zur Webcam-Auflösung (ohne Zusatzflächen)
            canvas.width = width;
            canvas.height = height;
          })
          .catch(function(err) {
            console.error("Error starting webcam:", err);
            parameters.webcamEnabled = false;
          });
      }

      function stopWebcam() {
        if (currentStream) {
          currentStream.getTracks().forEach(track => track.stop());
          currentStream = null;
        }
      }

      function changeWebcamSource(newSource) {
        parameters.webcamSource = newSource;
        if (parameters.webcamEnabled) {
          stopWebcam();
          startWebcam();
        }
      }

      function changeWebcamResolution(newRes) {
        parameters.webcamResolution = newRes;
        const [width, height] = newRes.split('x').map(Number);
        
        // Aktualisiere die min/max-Werte für die Region of Interest (ROI)
        parameters.minX = 0;
        parameters.maxX = width - 1;
        
        // Aktualisiere die Center Lines
        parameters.centerX = width / 2;
        parameters.centerY = height / 2;
        
        // Falls die GUI-Controller vorhanden sind, aktualisieren
        if (minXController) {
          minXController.__min = 0;
          minXController.__max = width - 1;
          minXController.updateDisplay();
        }
        if (maxXController) {
          maxXController.__min = 0;
          maxXController.__max = width - 1;
          maxXController.updateDisplay();
        }
        if (centerXController) {
          centerXController.__min = 0;
          centerXController.__max = width;
          centerXController.updateDisplay();
        }
        if (centerYController) {
          centerYController.__min = 0;
          centerYController.__max = height;
          centerYController.updateDisplay();
        }
        
        // Webcam neu starten mit der neuen Auflösung
        if (parameters.webcamEnabled) {
          stopWebcam();
          startWebcam();
        }
      }

      function updateCameraList() {
        if (navigator.mediaDevices && navigator.mediaDevices.enumerateDevices) {
          navigator.mediaDevices.enumerateDevices()
            .then(function(devices) {
              const videoDevices = devices.filter(device => device.kind === 'videoinput');
              let options = videoDevices.map(device => device.deviceId);
              if(options.length > 0 && !parameters.webcamSource) {
                parameters.webcamSource = options[0];
              }
              if (webcamSourceController) {
                webcamSourceController.options(options);
              }
            })
            .catch(function(err) {
              console.error("Error enumerating devices: ", err);
            });
        }
      }
      
      function analyzeRegion() {
        let offscreenCanvas = document.createElement('canvas');
        offscreenCanvas.width = canvas.width;
        offscreenCanvas.height = canvas.height;
        let offCtx = offscreenCanvas.getContext('2d');
        
        if (parameters.webcamEnabled && video && video.readyState === video.HAVE_ENOUGH_DATA) {
          // Webcam-Frame für die Analyse speichern
          offCtx.drawImage(video, 0, 0, offscreenCanvas.width, offscreenCanvas.height);
        } else if (binImg) {
          // Hochgeladenes Bild verwenden
          offCtx.drawImage(binImg, 0, 0);
        } else {
          console.error("Kein Bild oder Webcam-Frame verfügbar!");
          return;
        }
        
        // Bildverarbeitung (Schwellenwert, Farben)
        let imageData = offCtx.getImageData(0, 0, offscreenCanvas.width, offscreenCanvas.height);
        let data = imageData.data;
        
        for (let i = 0; i < data.length; i += 4) {
          let gray = parameters.red ? data[i] :
          parameters.green ? data[i+1] :
          parameters.blue ? data[i+2] :
          0.299 * data[i] + 0.587 * data[i+1] + 0.114 * data[i+2];
          
          let binary = (gray > parameters.threshold) ? 255 : 0;
          data[i] = data[i+1] = data[i+2] = binary;
        }
        
        offCtx.putImageData(imageData, 0, 0);
        
        // **Neue binäre Daten für die Analyse verwenden**
        let analyzedImgData = offCtx.getImageData(0, 0, offscreenCanvas.width, offscreenCanvas.height);
        let analyzedData = analyzedImgData.data;
        
        const minX = Math.min(parameters.minX, parameters.maxX);
        const maxX = Math.max(parameters.minX, parameters.maxX);
        
        let oldTable = document.getElementById('resultTable');
        if (oldTable) oldTable.parentNode.removeChild(oldTable);
        
        let table = document.createElement('table');
        table.id = 'resultTable';
        let header = document.createElement('tr');
        let th1 = document.createElement('th'); th1.textContent = 'Zeile';
        let th2 = document.createElement('th'); th2.textContent = 'Start Spalte';
        let th3 = document.createElement('th'); th3.textContent = 'End Spalte';
        header.appendChild(th1);
        header.appendChild(th2);
        header.appendChild(th3);
        table.appendChild(header);
        
        for (let row = 0; row < offscreenCanvas.height; row++) {
          let inRun = false;
          let startCol = 0;
          for (let x = minX; x <= maxX; x++) {
            let index = (x + row * offscreenCanvas.width) * 4;
            let val = analyzedData[index] === 255 ? 1 : 0;
            
            if (!inRun && val === 1) {
              inRun = true;
              startCol = x;
            } else if (inRun && val === 0) {
              inRun = false;
              let tableRow = document.createElement('tr');
              let td1 = document.createElement('td'); td1.textContent = row;
              let td2 = document.createElement('td'); td2.textContent = startCol;
              let td3 = document.createElement('td'); td3.textContent = x - 1;
              tableRow.appendChild(td1);
              tableRow.appendChild(td2);
              tableRow.appendChild(td3);
              table.appendChild(tableRow);
            }
          }
          if (inRun) {
            let tableRow = document.createElement('tr');
            let td1 = document.createElement('td'); td1.textContent = row;
            let td2 = document.createElement('td'); td2.textContent = startCol;
            let td3 = document.createElement('td'); td3.textContent = maxX;
            tableRow.appendChild(td1);
            tableRow.appendChild(td2);
            tableRow.appendChild(td3);
            table.appendChild(tableRow);
          }
        }
        
        document.body.appendChild(table);
        table.style.marginTop = (canvas.height + 10) + 'px';
      }

      // -----------------------------------------------------

      document.getElementById('fileInput').addEventListener('change', handleFile);
      window.addEventListener('load', init);
    })();
  </script>
</body>
</html>
