<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Sortierte Liste — sichtbar</title>
  <style>
    :root{
      --bg:#0f1724;
      --card:#0b1220;
      --accent:#06b6d4;
      --muted:#94a3b8;
      --text:#e6eef6;
    }
    *{box-sizing:border-box}
    html,body{height:100%}
    body{
      margin:0;
      font-family:Inter, system-ui, -apple-system, "Segoe UI", Roboto, Arial;
      background:linear-gradient(180deg,#071021 0%,#081426 60%);
      color:var(--text);
      display:flex;
      align-items:center;
      justify-content:center;
      padding:24px;
    }

    /* Card zentriert */
    .card{
      width:min(980px, 96vw);
      max-height: calc(100vh - 48px); /* nutzt verfügbaren Viewport, lässt Abstand */
      display:flex;
      flex-direction:column;
      background:linear-gradient(180deg, rgba(255,255,255,0.02), rgba(255,255,255,0.01));
      border:1px solid rgba(255,255,255,0.04);
      border-radius:12px;
      padding:16px;
      box-shadow: 0 8px 30px rgba(2,6,23,0.6);
      overflow: hidden; /* verhindert, dass äußere Card überläuft */
    }

    header{
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap:12px;
      margin-bottom:10px;
      flex: 0 0 auto;
    }
    h1{font-size:18px;margin:0}
    .meta{color:var(--muted); font-size:13px}

    /* Table wrapper nimmt restliche Höhe und macht inneren Scroll */
    .table-wrap{
      border-radius:8px;
      background:linear-gradient(180deg, rgba(255,255,255,0.01), rgba(0,0,0,0.02));
      padding:8px;
      margin-top:6px;
      flex: 1 1 auto;           /* wächst, um verfügbaren Platz zu füllen */
      min-height: 160px;
      overflow: auto;          /* innerer Scroll wenn Inhalt zu groß */
    }

    table{
      width:100%;
      border-collapse:collapse;
      font-size:14px;
      min-width:320px;
    }
    thead th{
      text-align:left;
      font-size:12px;
      color:var(--muted);
      padding:10px 12px;
      position:sticky;
      top:0;
      background:linear-gradient(180deg, rgba(6,11,18,0.85), rgba(4,8,12,0.85));
      backdrop-filter: blur(6px);
      z-index:3;
    }
    tbody td{
      padding:10px 12px;
      border-top:1px solid rgba(255,255,255,0.03);
      color:var(--text);
    }
    tbody tr:nth-child(odd){
      background:linear-gradient(90deg, rgba(255,255,255,0.006), rgba(255,255,255,0.004));
    }

    .index { width:48px; color:var(--muted); font-variant-numeric:tabular-nums; }

    .controls{ display:flex; gap:8px; align-items:center; margin-bottom:8px; flex:0 0 auto; }
    input[type="search"]{
      background:transparent;
      border:1px solid rgba(255,255,255,0.04);
      color:var(--text);
      padding:8px 10px;
      border-radius:8px;
      outline:none;
      min-width:200px;
    }
    .small{ font-size:13px; color:var(--muted); }

    @media (max-width:560px){
      .card{padding:12px}
      thead th, tbody td{padding:8px}
    }
  </style>
</head>
<body>
  <div class="card" role="main" aria-label="Sortierte Tabelle">
    <header>
      <h1>Sortierte Titel</h1>
      <div class="meta">Anzahl: <strong id="count"></strong></div>
    </header>

    <div class="controls">
      <input id="filter" type="search" placeholder="Filtern..." aria-label="Filtern der Tabelle">
      <div class="small">Tippe zum Filtern</div>
    </div>

    <div class="table-wrap" aria-live="polite">
      <table id="titles">
        <thead>
          <tr>
            <th class="index">#</th>
            <th>Titel</th>
          </tr>
        </thead>
        <tbody></tbody>
      </table>
    </div>
  </div>

  <script>
    const data = [
      "M.A.S.K. - Die komplette Serie, Episoden",
      "Batman: The Complete Animated",
      "Käpt'n Balu und seine tollkühne Crew",
      "Sindbad - Komplettbox",
      "Denver, the Last Dinosaur",
      "Silverhawks - Die Retter des Universums",
      "StarCom: Das Galaxis-Team (Starcom: The U.S. Space Force)",
      "Bob Morane Komplettbox",
      "Sancho und Pancho - Die komplette Zeichentrick-Serie",
      "Captain Future - Komplettbox",
      "C.O.P.S. (COPS) - Actiongeladene Polizeiserie",
      "Bravestarr - Gesamtbox",
      "Signor Rossi - Die komplette Serie",
      "Adolars phantastische Abenteuer",
      "Transformers 80s",
      "Die Königin der tausend Jahre - Remastered Edition",
      "Mila Superstar - Die komplette Serie",
      "Cat’s Eyes",
      "Thundercats - Die starken Katzen aus dem All",
      "She-Ra - Princess of Power - Die komplette Serie",
      "Galaxy Rangers - Superbox",
      "Hong Kong Pfui - Die komplette 16-teilige Kult-Zeichentrick-Serie",
      "The Legend of Zelda",
      "Das Dschungelbuch: Die Serie - Die komplette Serie",
      "Chip & Chap: Die Ritter des Rechts",
      "Ducktales - Geschichten aus Entenhausen",
      "Die Schnorchels - Die komplette erste Staffel",
      "Tom & Jerry - The Ultimate Collection",
      "Saber Rider and the Star Sheriffs - Gesamtausgabe",
      "Cadillacs und Dinosaurier",
      "Die Abenteuer von Super Mario Bros. 3",
      "Die große Asterix Edition",
      "Captain N: Der Game Master",
      "The New Super Mario World",
      "Wo steckt Carmen Sandiego?",
      "Reporter Blues",
      "Defenders of the Earth-Die Retter der Erde"
    ];

    const collator = new Intl.Collator('de', {sensitivity:'base', ignorePunctuation:true});
    const sorted = data.slice().sort((a,b) => collator.compare(a, b));
    const tbody = document.querySelector("#titles tbody");
    const countEl = document.getElementById("count");
    const filter = document.getElementById("filter");

    function render(list){
      tbody.innerHTML = "";
      list.forEach((t, i) => {
        const tr = document.createElement("tr");
        const tdIndex = document.createElement("td");
        tdIndex.className = "index";
        tdIndex.textContent = String(i+1).padStart(2, " ");
        const tdTitle = document.createElement("td");
        tdTitle.textContent = t;
        tr.appendChild(tdIndex);
        tr.appendChild(tdTitle);
        tbody.appendChild(tr);
      });
      countEl.textContent = list.length;
    }

    render(sorted);

    filter.addEventListener("input", (e) => {
      const q = e.target.value.trim().toLowerCase();
      if(!q){ render(sorted); return; }
      render(sorted.filter(s => s.toLowerCase().includes(q)));
    });

    // damit Tabellenkopf bei innerem Scroll sichtbar bleibt
    // (position:sticky funktioniert innerhalb des scrollbaren .table-wrap)
    filter.focus();
  </script>
</body>
</html>
